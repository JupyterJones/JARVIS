[package]
name = "jarvis"
version = "1.0.0"
description = "Stark Industries J.A.R.V.I.S. Assistant (Esperanza Edition)"
authors = ["Jack & Esperanza"]
edition = "2021"

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json", "blocking"] }
chrono = "0.4"
